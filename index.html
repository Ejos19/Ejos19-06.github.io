<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prospecciones - Alta / Actualizar</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contenedor">
      <div class="columna-izquierda">
        <div class="header">
          <h1>Prospecciones</h1>
          <p>Nuevo registro o actualizar existente</p>
        </div>

        <label for="modeSelect">Modo</label>
        <div class="contenedor-input">
          <select id="modeSelect">
            <option value="nuevo">➕ Nuevo registro</option>
            <option value="actualizar">✏️ Actualizar existente</option>
          </select>
        </div>

        <form id="mainForm">
          <!-- Seleccionar RIF existente -->
          <div class="contenedor-input" id="divRifSelect" style="display: none">
            <label for="rifSelect">Seleccionar RIF existente</label>
            <select id="rifSelect" name="rifSelect">
              <option value="">Cargando RIFs...</option>
            </select>
          </div>

          <!-- Inputs -->
          <div class="contenedor-input" id="divRifInput">
            <label for="rif">RIF</label>
            <input id="rif" name="rif" type="text" placeholder="J-12345678-9" />
          </div>

          <div class="contenedor-input">
            <label for="fecha">FECHA</label><input id="fecha" type="date" />
          </div>
          <div class="contenedor-input">
            <label for="region">REGIÓN</label><input id="region" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="ejecutiva">EJECUTIVA</label
            ><input id="ejecutiva" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="razonsocial">RAZÓN SOCIAL</label
            ><input id="razonsocial" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="servicio">SERVICIO</label
            ><input id="servicio" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="propuesta">PROPUESTA</label
            ><input id="propuesta" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="srm">SRM</label><input id="srm" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="beneficios">BENEFICIOS</label
            ><input id="beneficios" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="observaciones">OBSERVACIONES</label
            ><input id="observaciones" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="estatus">ESTATUS</label
            ><input id="estatus" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="fechacap">FECHACAP</label
            ><input id="fechacap" type="date" />
          </div>
          <div class="contenedor-input">
            <label for="codigocliente">CÓDIGO CLIENTE</label
            ><input id="codigocliente" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="rangokg">RANGO KG</label
            ><input id="rangokg" type="text" />
          </div>
          <div class="contenedor-input">
            <label for="codigof">CÓDIGOF</label
            ><input id="codigof" type="text" />
          </div>

          <div class="contenedor-boton">
            <button type="submit" id="btnSubmit">Guardar</button>
          </div>
        </form>

        <div id="exito" class="exito" style="display: none; margin-top: 16px">
          ✅ Registro guardado/actualizado correctamente.
        </div>
      </div>

      <div class="columna-derecha"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
