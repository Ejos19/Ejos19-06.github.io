<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Prospecciones</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Formulario de Prospecciones</h1>

      <!-- 🔹 Formulario principal -->
      <form id="prosForm">
        <!-- Cada campo se vincula directamente con el nombre de columna de tu hoja -->

        <label>FECHA:</label>
        <input type="date" name="FECHA" required />

        <label>REGIÓN:</label>
        <input
          type="text"
          name="REGIÓN"
          placeholder="Ej: Occidente, Centro, Oriente"
          required
        />

        <label>EJECUTIVA:</label>
        <input
          type="text"
          name="EJECUTIVA"
          placeholder="Nombre de la ejecutiva"
          required
        />

        <label>RIF:</label>
        <input type="text" name="RIF" placeholder="Ej: J-12345678-9" required />

        <label>RAZÓNSOCIAL:</label>
        <input
          type="text"
          name="RAZÓNSOCIAL"
          placeholder="Nombre de la empresa"
          required
        />

        <label>SERVICIO:</label>
        <input type="text" name="SERVICIO" placeholder="Tipo de servicio" />

        <label>PROPUESTA:</label>
        <textarea
          name="PROPUESTA"
          placeholder="Detalles de la propuesta"
        ></textarea>

        <label>SRM:</label>
        <input type="text" name="SRM" placeholder="SRM relacionado" />

        <label>BENEFICIOS:</label>
        <textarea
          name="BENEFICIOS"
          placeholder="Beneficios ofrecidos"
        ></textarea>

        <label>OBSERVACIONES:</label>
        <textarea
          name="OBSERVACIONES"
          placeholder="Observaciones del cliente o notas"
        ></textarea>

        <label>ESTATUS:</label>
        <input
          type="text"
          name="ESTATUS"
          placeholder="Ej: En proceso, Cerrado, Rechazado"
        />

        <label>FECHACAP:</label>
        <input type="date" name="FECHACAP" />

        <label>codigocliente:</label>
        <input
          type="text"
          name="codigocliente"
          placeholder="Código interno de cliente"
        />

        <label>RANGOKG:</label>
        <input
          type="text"
          name="RANGOKG"
          placeholder="Ej: 0-100kg, 100-500kg, etc."
        />

        <label>CÓDIGOF:</label>
        <input
          type="text"
          name="CÓDIGOF"
          placeholder="Código final del registro"
        />

        <button type="submit">Enviar Registro</button>
      </form>

      <!-- Zona de mensajes -->
      <div id="mensaje"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
